<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CloudKit TODO</title>
  </head>
  <body>
    <header class="bar">
      <h1 class="grow">CloudKit TODO</h1>
      <span id="who" class="muted small"></span>
      <button id="sign-in" class="primary" hidden>Sign in with Apple</button>
    </header>

    <div id="config-missing" class="notice" hidden></div>

    <main id="main" hidden>
      <form id="add-form" class="row add">
        <input id="add-input" class="grow" type="text" autocomplete="off"
               placeholder="Add a TODO… (#tag !high due:2026-12-31)" maxlength="500" />
        <button class="primary" type="submit">Add</button>
      </form>
      <ul id="list" class="list"></ul>
      <p id="empty" class="muted empty" hidden>Nothing to do. 🎉</p>
    </main>

    <div id="status" class="status" hidden></div>

    <footer class="row foot">
      <button id="open-panel" class="link" type="button">Bulk edit in side panel</button>
      <span class="grow"></span>
      <button id="open-options" class="link" type="button">Settings</button>
    </footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
