# Toolchain + task runner. Every task delegates to a TypeScript script in ./scripts,
# which Node runs directly (no build step), so the logic is reviewable, typechecked and
# runnable without mise: `node scripts/<name>.ts`. Works on Linux, macOS and Windows; no
# Xcode needed (schema tasks use Apple's CKTool JS, see ADR-0012).  List tasks: `mise tasks`
#
# Local env vars: .env.local (see .env.example) is loaded by each script.
# You may instead put them under [env] in mise.local.toml (gitignored).

[tools]
node = "24"
pnpm = "11"
gitleaks = "8"
# uv = "latest"   # only if Python tooling is added (see ADR-0011)

[settings]
experimental = false

[tasks.setup]
description = "First-time setup: install deps, create .env.local/.envrc from templates, install git hooks"
run = "node scripts/setup.ts"

[tasks.doctor]
description = "Check toolchain and local configuration (never prints secret values)"
run = "node scripts/doctor.ts"

[tasks.dev]
description = "Build the extension to dist/ and rebuild on change"
run = "node scripts/dev.ts"

[tasks.build]
description = "Production build of the extension into dist/"
run = "node scripts/build.ts"

[tasks.test]
description = "Run unit tests (vitest)"
run = "node scripts/test.ts"

[tasks.check]
description = "Typecheck (extension + scripts), test, build and scan for secrets"
run = "node scripts/check.ts"

[tasks.package]
description = "Build and zip dist/ into artifacts/ for store upload"
run = "node scripts/package.ts"

[tasks.icons]
description = "Regenerate PNG icons in public/icons"
run = "node scripts/gen-icons.ts"

[tasks."ext:key"]
description = "Generate the extension signing key (pins the extension ID) and record the public key in .env.local"
run = "node scripts/ext-key.ts"

[tasks."ext:info"]
description = "Print extension ID and the Sign In Callback URL to configure in CloudKit"
run = "node scripts/ext-info.ts"

[tasks."ck:token"]
description = "Save the CloudKit management token (hidden prompt) as CLOUDKIT_MANAGEMENT_TOKEN in .env.local"
run = "node scripts/ck.ts token"

[tasks."ck:validate"]
description = "Validate cloudkit/schema.ckdb against the container"
run = "node scripts/ck.ts validate"

[tasks."ck:import"]
description = "Import cloudkit/schema.ckdb into the development environment"
run = "node scripts/ck.ts import"

[tasks."ck:export"]
description = "Export the container's development schema to cloudkit/schema.exported.ckdb"
run = "node scripts/ck.ts export"

[tasks."ck:reset"]
description = "Reset the development schema and data to production (destructive, asks first)"
run = "node scripts/ck.ts reset"

[tasks."secrets:scan"]
description = "Scan the working tree and git history for secrets with gitleaks"
run = "node scripts/secrets-scan.ts"

[tasks."ck:teams"]
description = "List Apple Developer teams your management token can access (find APPLE_TEAM_ID)"
run = "node scripts/ck.ts teams"
