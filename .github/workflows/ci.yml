name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - run: pnpm install --frozen-lockfile

      # Builds without CloudKit config: the extension compiles, it just can't
      # reach CloudKit. No secrets are needed or used in CI.
      - run: mise run check
